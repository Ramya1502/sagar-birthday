<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Some Memories ♡</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="memories-page">

    <div class="memory-bg"></div>


    <main class="memories-container">


        <!-- HEADER -->

        <div class="memory-header">

            <p>A FEW MEMORIES ✦</p>

            <h1>
                Little moments<br>
                <span>worth keeping.</span>
            </h1>

        </div>


        <!-- PHOTO -->

        <div class="photo-wrapper">

            <div
                class="memory-card"
                id="memoryCard"
            >

                <img
                    id="memoryImage"
                    src="photo1.jpg"
                    alt="Memory"
                >


                <div class="slide-overlay"></div>


                <div class="slide-caption">

                    <span id="memoryNumber">
                        01
                    </span>

                    <p id="memoryText">
                        Some moments are ordinary...
                        until you remember them.
                    </p>

                </div>

            </div>

        </div>


        <!-- COUNTER -->

        <div class="memory-bottom">

            <div class="memory-counter">

                <span id="currentNumber">
                    01
                </span>

                <span class="counter-line"></span>

                <span>
                    10
                </span>

            </div>


            <p>
                tap the photo to continue
            </p>

        </div>


        <!-- NEXT PAGE -->

        <button
            class="memory-next"
            onclick="goToWishes()">

            there's more ♡

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
